<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palmi 模式切换原型</title>
  <style>
    :root {
      color-scheme: light dark;
      --glass-white: rgba(255, 255, 255, 0.82);
      --glass-black: rgba(0, 0, 0, 0.78);
      --stroke-white: rgba(255, 255, 255, 0.32);
      --stroke-black: rgba(0, 0, 0, 0.18);
      --shadow-black: rgba(0, 0, 0, 0.28);
      --shadow-white: rgba(255, 255, 255, 0.22);
      --mono: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
      --sans: "SF Pro Rounded", "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0b0b;
      font-family: var(--sans);
      touch-action: none;
    }

    body {
      position: relative;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    body.dragging #scene {
      cursor: grabbing;
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      left: 50%;
      width: min(48vw, 268px);
      height: 72px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      letter-spacing: 0.18em;
      font-weight: 700;
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transform-origin: center center;
      transition:
        box-shadow 220ms ease,
        background-color 220ms ease,
        color 220ms ease,
        border-color 220ms ease;
      pointer-events: auto;
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
    }

    .bubble::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 38%),
        linear-gradient(325deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 40%);
      opacity: 0.85;
      pointer-events: none;
    }

    .bubble-label {
      position: relative;
      z-index: 1;
    }

    .bubble-chat {
      top: 12.5vh;
      transform: translateX(-50%);
      background: var(--glass-white);
      color: #050505;
      border: 1px solid var(--stroke-white);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .bubble-pro {
      bottom: 12.5vh;
      transform: translateX(-50%);
      background: var(--glass-black);
      color: #fcfcfc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .mode-badge {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0.88;
      transition: all 260ms ease;
      pointer-events: none;
    }

    .mode-badge.light {
      background: rgba(0, 0, 0, 0.06);
      color: rgba(0, 0, 0, 0.62);
      border-color: rgba(0, 0, 0, 0.09);
    }

    @media (max-width: 720px) {
      .bubble {
        width: min(62vw, 260px);
        height: 68px;
      }

      .bubble-chat {
        top: 10vh;
      }

      .bubble-pro {
        bottom: 10vh;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="ui-layer">
    <div class="mode-badge" id="modeBadge">Mode Switch Prototype</div>
    <button class="bubble bubble-chat" id="chatBubble" type="button" aria-label="切换到聊天模式">
      <span class="bubble-label">聊天</span>
    </button>
    <button class="bubble bubble-pro" id="proBubble" type="button" aria-label="切换到专业模式">
      <span class="bubble-label">专业</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const chatBubble = document.getElementById("chatBubble");
    const proBubble = document.getElementById("proBubble");
    const modeBadge = document.getElementById("modeBadge");

    const state = {
      width: 0,
      height: 0,
      dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
      progress: 0,
      targetProgress: 0,
      dragProgressStart: 0,
      dragging: false,
      sphereRadius: 0,
      lastPointerY: 0,
      lastTimestamp: 0
    };

    const glyphs = [];
    const cubePoints = [];
    const glyphChars = "01[]{}<>/\\\\|-_+=*#;:.";

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(420420);

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function resize() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      state.sphereRadius = Math.min(state.width, state.height) * 0.18;

      glyphs.length = 0;
      const glyphCount = Math.max(90, Math.floor((state.width * state.height) / 13000));
      for (let index = 0; index < glyphCount; index += 1) {
        glyphs.push({
          x: random() * state.width,
          y: random() * state.height,
          drift: mix(-28, 28, random()),
          speed: mix(0.02, 0.11, random()),
          size: mix(9, 14, random()),
          alpha: mix(0.08, 0.22, random()),
          phase: random() * Math.PI * 2,
          char: glyphChars[Math.floor(random() * glyphChars.length)]
        });
      }
    }

    function createSpherePoints() {
      cubePoints.length = 0;
      const count = 184;
      const offset = 2 / count;
      const increment = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < count; i += 1) {
        const y = ((i * offset) - 1) + (offset / 2);
        const radius = Math.sqrt(1 - y * y);
        const phi = i * increment;
        cubePoints.push({
          x: Math.cos(phi) * radius,
          y,
          z: Math.sin(phi) * radius,
          phase: random() * Math.PI * 2,
          band: Math.floor(random() * 4)
        });
      }
    }

    function drawBackground(time) {
      const width = state.width;
      const height = state.height;
      const blackRatio = clamp(0.5 + state.progress * 0.5, 0, 1);
      const boundaryY = height * blackRatio;
      const amplitude = mix(8, 26, 1 - Math.abs(state.progress));
      const wavelength = width * 0.9;

      ctx.fillStyle = "#f5f5f1";
      ctx.fillRect(0, 0, width, height);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(width, 0);
      ctx.lineTo(width, boundaryY);

      const steps = 48;
      for (let step = steps; step >= 0; step -= 1) {
        const x = (step / steps) * width;
        const theta = (x / wavelength) * Math.PI * 2 + time * 0.55;
        const y = boundaryY + Math.sin(theta) * amplitude + Math.cos(theta * 0.6 - time * 0.23) * amplitude * 0.32;
        ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.fillStyle = "#060606";
      ctx.fill();

      ctx.save();
      ctx.globalCompositeOperation = "overlay";
      const glow = ctx.createRadialGradient(width * 0.5, height * 0.5, 20, width * 0.5, height * 0.5, Math.max(width, height) * 0.55);
      glow.addColorStop(0, `rgba(255,255,255,${0.035 + Math.abs(state.progress) * 0.02})`);
      glow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();

      drawGlyphs(time, boundaryY);
    }

    function drawGlyphs(time, boundaryY) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `500 12px ${getComputedStyle(document.documentElement).getPropertyValue("--mono")}`;

      glyphs.forEach((glyph, index) => {
        const x = (glyph.x + Math.sin(time * glyph.speed + glyph.phase) * glyph.drift + state.width) % state.width;
        const y = (glyph.y + Math.cos(time * glyph.speed * 0.8 + glyph.phase) * 10 + state.height) % state.height;
        const onBlack = y <= boundaryY;
        const glitch = (Math.sin(time * 1.6 + index) + Math.cos(time * 0.37 - glyph.phase)) * 0.5;
        const glowAlpha = glyph.alpha + Math.max(0, glitch) * 0.06;

        ctx.font = `500 ${glyph.size}px ${getComputedStyle(document.documentElement).getPropertyValue("--mono")}`;
        if (onBlack) {
          ctx.fillStyle = glitch > 0.92 ? `rgba(123, 246, 255, ${glowAlpha})` : `rgba(255, 255, 255, ${glowAlpha})`;
        } else {
          ctx.fillStyle = glitch > 0.92 ? `rgba(255, 75, 120, ${glowAlpha * 0.8})` : `rgba(0, 0, 0, ${glowAlpha * 0.75})`;
        }
        ctx.fillText(glyph.char, x, y);
      });
    }

    function drawSphere(time) {
      const centerX = state.width * 0.5;
      const centerY = state.height * 0.5;
      const radius = state.sphereRadius;
      const tiltX = -0.62 + Math.sin(time * 0.17) * 0.12;
      const tiltY = time * 0.22 + state.progress * 0.4;
      const sinX = Math.sin(tiltX);
      const cosX = Math.cos(tiltX);
      const sinY = Math.sin(tiltY);
      const cosY = Math.cos(tiltY);
      const splitThreshold = -state.progress * 0.95;
      const projected = [];

      cubePoints.forEach((point) => {
        const pulse = 1 + Math.sin(time * 1.8 + point.phase + point.band * 0.9) * 0.08;

        const px = point.x * pulse;
        const py = point.y * pulse;
        const pz = point.z * pulse;

        const x1 = px * cosY - pz * sinY;
        const z1 = px * sinY + pz * cosY;
        const y1 = py * cosX - z1 * sinX;
        const z2 = py * sinX + z1 * cosX;
        const perspective = 1 / (1 + (z2 + 1.8) * 0.55);
        const screenX = centerX + x1 * radius * perspective;
        const screenY = centerY + y1 * radius * perspective;
        const cubeSize = mix(6, 12, perspective) + Math.sin(time * 2.1 + point.phase) * 0.65;
        const isBlack = y1 > splitThreshold;

        projected.push({
          x: screenX,
          y: screenY,
          z: z2,
          size: cubeSize,
          isBlack
        });
      });

      projected.sort((a, b) => a.z - b.z);

      const halo = ctx.createRadialGradient(centerX, centerY, radius * 0.24, centerX, centerY, radius * 1.38);
      halo.addColorStop(0, "rgba(255,255,255,0.07)");
      halo.addColorStop(0.45, "rgba(255,255,255,0.02)");
      halo.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 1.45, 0, Math.PI * 2);
      ctx.fill();

      projected.forEach((cube) => {
        const half = cube.size * 0.5;
        const depthShade = clamp((cube.z + 1.5) / 3, 0, 1);

        ctx.save();
        ctx.translate(cube.x, cube.y);
        ctx.rotate((cube.z * 0.12) + Math.sin(time * 0.6 + cube.x * 0.004) * 0.06);

        ctx.fillStyle = cube.isBlack ? "#050505" : "#fafaf7";
        ctx.strokeStyle = cube.isBlack
          ? `rgba(255,255,255,${0.06 + depthShade * 0.16})`
          : `rgba(0,0,0,${0.05 + depthShade * 0.14})`;
        ctx.lineWidth = 1;
        ctx.fillRect(-half, -half, cube.size, cube.size);
        ctx.strokeRect(-half, -half, cube.size, cube.size);

        ctx.globalAlpha = cube.isBlack ? 0.22 : 0.16;
        ctx.fillStyle = cube.isBlack ? "#ffffff" : "#000000";
        ctx.fillRect(-half + 1.2, -half + 1.2, cube.size * 0.16, cube.size * 0.16);
        ctx.restore();
      });
    }

    function updateBubbles() {
      const chatProgress = clamp(state.progress, 0, 1);
      const proProgress = clamp(-state.progress, 0, 1);
      const chatBurst = Math.max(0, (chatProgress - 0.72) / 0.28);
      const proBurst = Math.max(0, (proProgress - 0.72) / 0.28);
      const chatScale = 1 + chatProgress * 0.12 + easeOutCubic(chatBurst) * 9.6;
      const proScale = 1 + proProgress * 0.12 + easeOutCubic(proBurst) * 9.6;

      chatBubble.style.transform = `translateX(-50%) scale(${chatScale})`;
      proBubble.style.transform = `translateX(-50%) scale(${proScale})`;
      chatBubble.style.opacity = `${mix(0.88, 1, chatProgress)}`;
      proBubble.style.opacity = `${mix(0.88, 1, proProgress)}`;

      const dominantChat = state.progress > 0.5;
      const dominantPro = state.progress < -0.5;
      if (dominantChat) {
        modeBadge.textContent = "聊天模式 / Chat";
        modeBadge.classList.remove("light");
      } else if (dominantPro) {
        modeBadge.textContent = "专业模式 / Pro";
        modeBadge.classList.add("light");
      } else {
        modeBadge.textContent = "Mode Switch Prototype";
        modeBadge.classList.toggle("light", state.progress < 0);
      }
    }

    function frame(timestamp) {
      const time = timestamp * 0.001;
      if (!state.dragging) {
        state.progress += (state.targetProgress - state.progress) * 0.08;
      }

      ctx.clearRect(0, 0, state.width, state.height);
      drawBackground(time);
      drawSphere(time);
      updateBubbles();
      requestAnimationFrame(frame);
    }

    function startDrag(event) {
      const pointerY = event.touches ? event.touches[0].clientY : event.clientY;
      const pointerX = event.touches ? event.touches[0].clientX : event.clientX;
      const dx = pointerX - state.width * 0.5;
      const dy = pointerY - state.height * 0.5;
      const withinSphere = Math.sqrt(dx * dx + dy * dy) <= state.sphereRadius * 1.45;
      if (!withinSphere) return;

      state.dragging = true;
      state.dragProgressStart = state.progress;
      state.lastPointerY = pointerY;
      document.body.classList.add("dragging");
      event.preventDefault();
    }

    function drag(event) {
      if (!state.dragging) return;
      const pointerY = event.touches ? event.touches[0].clientY : event.clientY;
      const delta = pointerY - state.lastPointerY;
      state.lastPointerY = pointerY;
      state.progress = clamp(state.progress + delta / (state.height * 0.62), -1, 1);
      state.targetProgress = state.progress;
      event.preventDefault();
    }

    function endDrag() {
      if (!state.dragging) return;
      state.dragging = false;
      document.body.classList.remove("dragging");

      if (state.progress > 0.28) {
        state.targetProgress = 1;
      } else if (state.progress < -0.28) {
        state.targetProgress = -1;
      } else {
        state.targetProgress = 0;
      }
    }

    function toggleChat() {
      state.targetProgress = state.targetProgress === 1 ? 0 : 1;
    }

    function toggleProfessional() {
      state.targetProgress = state.targetProgress === -1 ? 0 : -1;
    }

    chatBubble.addEventListener("click", toggleChat);
    proBubble.addEventListener("click", toggleProfessional);

    canvas.addEventListener("mousedown", startDrag);
    canvas.addEventListener("mousemove", drag);
    window.addEventListener("mouseup", endDrag);
    canvas.addEventListener("touchstart", startDrag, { passive: false });
    canvas.addEventListener("touchmove", drag, { passive: false });
    window.addEventListener("touchend", endDrag, { passive: true });

    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "j") toggleChat();
      if (event.key.toLowerCase() === "k") toggleProfessional();
      if (event.key.toLowerCase() === "r") state.targetProgress = 0;
    });

    window.addEventListener("resize", resize);

    createSpherePoints();
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
