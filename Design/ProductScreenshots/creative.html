<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Palmi — App Store Creative</title>
<style>
@font-face { font-family: 'Source Serif 4'; src: url('fonts/SourceSerif4-Variable.ttf'); font-weight: 200 900; }
@font-face { font-family: 'Noto Serif SC'; src: url('fonts/NotoSerifSC-Variable.ttf'); font-weight: 200 900; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
.canvas { position: relative; width: 3840px; height: 1646px; overflow: hidden; background: #f8f3e7; }
.art { position: absolute; width: 2469px; height: 1646px; left: 685.5px; top: 0; object-fit: contain; }
.paper { display: none; }
.art { mix-blend-mode: multiply; mask-image: linear-gradient(to right, transparent, black 7%, black 93%, transparent), linear-gradient(to bottom, transparent, black 7%, black 93%, transparent); mask-composite: intersect; }
.headline { display: none; }
.search { height: 2560px; }
.search .art { width: 3000px; height: 2000px; left: 420px; top: -20px; }
.search .headline { display: block; position: absolute; top: 1930px; left: 380px; width: 3080px; margin: 0; color: #152c56; text-align: center; font: 500 220px/1.15 'Source Serif 4', Georgia, serif; letter-spacing: -7px; }
.search:lang(zh-CN) .headline { font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 208px; letter-spacing: 8px; }
</style></head><body><main class="canvas" id="canvas"><img class="paper" src="assets/26.10/palmi-abstract-art.png" alt=""><img class="art" src="assets/26.10/palmi-abstract-art.png" alt=""><h1 class="headline" id="headline"></h1></main>
<script>
const q = new URLSearchParams(location.search);
const zh = q.get('lang') === 'zh';
document.documentElement.lang = zh ? 'zh-CN' : 'en';
document.getElementById('canvas').classList.toggle('search', q.get('placement') === 'search');
document.getElementById('headline').textContent = zh ? 'AI，随你所想。' : 'AI, on your terms.';
</script></body></html>
